version: 2

models:
  - name: spoilage_risk
    description: "Demo spoilage risk model based on sensor telemetry."

    columns:
      - name: container_id
        tests:
          - not_null

      - name: risk_score
        tests:
          - not_null

      - name: risk_level
        tests:
          - not_null



  - name: spoilage_arbitrage
    description: "Demo model for spoilage-aware market rerouting and arbitrage analysis."

    columns:
      - name: container_id
        tests:
          - not_null

      - name: recommended_market
        tests:
          - not_null

      - name: route_status
        tests:
          - not_null

      - name: risk_level
        tests:
          - not_null
